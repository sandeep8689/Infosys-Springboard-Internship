# Render Blueprint (repo root) — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: medical-symptom-analysis
    runtime: docker
    dockerfilePath: ./webapp/Dockerfile
    dockerContext: ./webapp
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
